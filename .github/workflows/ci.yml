name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            verilator gcc-riscv64-unknown-elf python3-yaml python3-serial
          verilator --version
          riscv64-unknown-elf-gcc --version | head -1

      - name: Generated files up to date
        run: make gen-check

      - name: Firmware
        run: make sw

      - name: Host tool tests
        run: make test-tools

      - name: Lint
        run: make lint

      - name: System simulation
        run: make test

      - name: ISP unit test (bit-exact vs. Python model)
        run: make -C hw/ip/isp/dv test

      - name: CSI-2 receiver unit test (D-PHY TX model, RTL vs. Python model)
        run: make -C hw/ip/csi2rx/dv test

      - name: H.264 encoder unit test (bit-exact vs. Python model)
        run: make -C hw/ip/h264/dv test

      - name: Upload logs and firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bow32-ci
          path: |
            build/sim/*.log
            build/isp_dv/*/sim.log
            build/csi2rx_dv/*/sim.log
            build/h264_dv/*/sim.log
            build/sim/h264.hex
            build/sw/*/*.bin
            build/sw/*/*.vmem
            build/sw/*/*.dis
