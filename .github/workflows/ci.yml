name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            verilator gcc-riscv64-unknown-elf python3-yaml python3-serial
          verilator --version
          riscv64-unknown-elf-gcc --version | head -1

      - name: Generated files up to date
        run: make gen-check

      - name: Firmware
        run: make sw

      - name: Host tool tests
        run: make test-tools

      - name: Lint
        run: make lint

      # Two testbench builds: KV260 camera (IMX219, 2 lanes) for the classic
      # tests, Huins MFP-VP1902 camera (IMX274, 4 lanes, Versal PHY model,
      # 200 MHz video clock) for camera274, csi2_274 and video274. Every test
      # runs; the step fails at the end if one failed (summary in the log).
      - name: System simulation (KV260 + Huins IMX274 builds)
        run: make test

      - name: ISP unit test (bit-exact vs. Python model)
        run: make -C hw/ip/isp/dv test

      # The aligner and the AFE side (the adapters' logic against models of the primitives,
      # the D-PHY's AFE controls and status) on their own, then the whole receiver
      - name: CSI-2 receiver unit test (AFE unit tests, D-PHY TX model, RTL vs. Python model)
        run: make -C hw/ip/csi2rx/dv test-rx

      # The controller alone at its PPI (bow_ppi_bfm): the timing of the D-PHY of Bow32 and
      # of a standard PHY through the flat-port wrapper (docs/ip/mipi_rx_arch.md, 5.5)
      - name: CSI-2 controller PPI bench (both timings, RTL vs. Python model)
        run: make -C hw/ip/csi2rx/dv test-ppi

      - name: H.264 encoder unit test (bit-exact vs. Python model)
        run: make -C hw/ip/h264/dv test

      - name: MKV block cipher unit test (RTL vs. model vs. Annex A of TCVN 14263:2024)
        run: make -C hw/ip/mkv/dv test

      - name: DDR2/DDR3 unit test (LiteDRAM core + Bow32 PHY, pin models, JEDEC checks)
        run: make -C hw/ip/ddr/dv test-ci JOBS=4

      - name: HyperRAM unit test (S80KS2562 pin model, TXV0108 card, loopback emulator)
        run: make -C hw/ip/hyperram/dv test-ci JOBS=4

      - name: Upload logs and firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bow32-ci
          path: |
            build/sim/*.log
            build/isp_dv/*/sim.log
            build/csi2rx_dv/*/sim.log
            build/h264_dv/*/sim.log
            build/mkv_dv/*/sim.log
            build/ddr_dv/*/sim.log
            build/hyperram_dv/*/sim.log
            build/sim/h264*.hex
            build/sw/*/*.bin
            build/sw/*/*.vmem
            build/sw/*/*.dis
